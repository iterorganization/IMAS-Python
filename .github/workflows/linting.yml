name: linting-and-code-formatting

on: 
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout IMAS-Python sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # choose lowest python version supported to reject syntax it cannot handle yet
          python-version: "3.9"

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install the code linting and formatting tools
        run: pip install --upgrade 'black >=25,<26' flake8

      - name: Check formatting of code with black
        run: black --check imas

      - name: Check linting with flake8
        run: flake8 imas
